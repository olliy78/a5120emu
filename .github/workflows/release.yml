# ─────────────────────────────────────────────────────────────────────────────
# Verteilbares Paket schnüren (Linux + Windows) — doc/design/13_distribution.md §7
# ─────────────────────────────────────────────────────────────────────────────
#
# Auslöser (Bedienung: doc/ci_pipeline.md):
#   * von Hand auf einem Branch → Paket bauen und prüfen, Ergebnis nur als
#                      Artefakt (Probelauf, kein Release).
#   * von Hand auf einem Tag v* → zusätzlich als Entwurf an das GitHub-Release
#                      hängen:  gh workflow run release.yml --ref v1.2.0
#   * Push eines Tags v* → dasselbe automatisch.  Der EINZIGE nicht-manuelle
#                      Auslöser der ganzen Pipeline, und auch der ist eine
#                      bewusste Handlung (`git push origin v1.2.0`).  Wer auch
#                      das von Hand will, streicht den `push:`-Block unten.
#
# Der Entwurf ist Absicht: ein Release ist nach außen gerichtet, da schaut vor
# dem Veröffentlichen jemand drauf.
#
# Zwei Jobs, ein Skript: beide rufen packaging/build_payload.sh auf, das die
# Plattformunterschiede selbst kennt (Bibliotheksnamen, Laufzeitbindung,
# beigelegter Installer, Archivform).  Die Liste „was gehört ins Paket" gibt es
# damit nur einmal.
#
# Gebaut wird auf ubuntu-22.04, NICHT auf ubuntu-latest: Rückwärtskompatibilität
# kommt von der Baseline, nicht vom Zielsystem — eine gegen glibc 2.39 gelinkte
# Bibliothek läuft auf keiner älteren Distribution (§7 des Entwurfs).  Wenn
# GitHub dieses Abbild abkündigt, ist der Nachfolger ein Container mit alter
# glibc (manylinux_2_28), nicht einfach ubuntu-latest.

name: Release-Paket

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      disks:
        description: 'Welche Beispieldisketten ins Paket'
        type: choice
        default: default
        options: [default, all, none]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux x86_64 — Paket
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write        # nur für das Anhängen ans Release nötig

    steps:
      - uses: actions/checkout@v4
        with:
          # build_payload.sh stempelt `git describe --tags` in VERSION — dafür
          # braucht es die ganze Historie.  `filter: blob:none` holt dabei nur
          # die Commits/Bäume und die Blobs des Arbeitsstands: das Repo trägt
          # ~500 MB Diskettenabbilder in der Historie, die hier niemand braucht.
          fetch-depth: 0
          filter: blob:none

      - name: Systempakete
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake

      - name: Paket schnüren
        # Das Script setzt selbst, was für ein VERTEILBARES Paket nicht
        # verhandelbar ist: -DK1520_FORMATS_DEFAULT= (sonst trägt die
        # Bibliothek den Pfad des Baurechners mit sich herum),
        # -DBUILD_K1520_TESTS=OFF, -static-libstdc++ -static-libgcc.
        env:
          DISKS: ${{ inputs.disks || 'default' }}
        run: packaging/build_payload.sh --disks "$DISKS"

      - name: Rauchtest — Bibliothek lädt, Pfade lösen auf
        # Ein Payload, dessen Bibliothek nichts exportiert oder der seine
        # formats.yaml nicht findet, darf kein Release-Asset werden (§7).
        run: |
          set -eu
          probe="$RUNNER_TEMP/probe"
          mkdir -p "$probe"
          tar xzf dist/*.tar.gz -C "$probe"
          root=$(echo "$probe"/*/payload)

          echo "── Pfadauflösung im Installationslayout ──"
          K1520_HOME="$root" python3 "$root/app/main.py" --paths | tee "$RUNNER_TEMP/paths.txt"
          grep -q '^Layout: *Installation' "$RUNNER_TEMP/paths.txt" \
            || { echo "FEHLER: Payload wird nicht als Installation erkannt"; exit 1; }
          ! grep -q 'NICHT GEFUNDEN' "$RUNNER_TEMP/paths.txt" \
            || { echo "FEHLER: ein Pfad löst nicht auf"; exit 1; }

          echo "── C-ABI ──"
          python3 - "$root/bin/libk1520core.so" <<'PY'
          import ctypes, sys
          lib = ctypes.CDLL(sys.argv[1])
          lib.k1520_version.restype = ctypes.c_char_p
          print("k1520_version:", lib.k1520_version().decode())
          PY

          echo "── kein Pfad des Baurechners in der Bibliothek ──"
          # Der Debugger steht mit auf der Liste: er linkt den Kern STATISCH und
          # erbt K1520_FORMATS_DEFAULT ueber k1520_floppy2 — traegt also
          # dieselbe Falle in sich (§10a.3 (2) des Entwurfs).
          for datei in "$root/bin/libk1520core.so" "$root/bin/k1520dbg"; do
            if grep -qa "$GITHUB_WORKSPACE/data/formats.yaml" "$datei"; then
              echo "FEHLER: einkompilierter Pfad des Baurechners in $datei"; exit 1
            fi
          done

          echo "── der Debugger startet und antwortet ──"
          # Eine Schalterabfrage gibt es nicht — k1520dbg OEFFNET immer eine
          # Sitzung, jedes freie Argument gilt als Diskette.  Geprueft wird
          # deshalb die Sitzung: aufmachen, `q`, sauber beenden.  Ohne Terminal
          # greift isocline nicht (isTerminal(0) ist falsch) — das ist genau der
          # Skriptpfad, den die cli_dbg_-Tests pinnen.
          printf 'q\n' | "$root/bin/k1520dbg" > "$RUNNER_TEMP/dbg.txt" 2>&1 \
            || { echo "FEHLER: k1520dbg startet nicht"; cat "$RUNNER_TEMP/dbg.txt"; exit 1; }
          head -3 "$RUNNER_TEMP/dbg.txt"
          # Und einmal mit eingelegter Diskette — dabei laeuft der Formatkatalog mit.
          disk=$(ls "$root/share/disks"/*.gz 2>/dev/null | head -1)
          if [ -n "$disk" ]; then
            gunzip -c "$disk" > "$RUNNER_TEMP/probe.hfe"
            printf 'q\n' | "$root/bin/k1520dbg" "$RUNNER_TEMP/probe.hfe" >/dev/null 2>&1 \
              || { echo "FEHLER: k1520dbg beendet sich nicht auf q"; exit 1; }
            echo "     Sitzung an einer Diskette: laeuft und endet auf q"
          fi

          echo "── Werkzeuge, Handbuecher und Lizenzen liegen bei ──"
          for datei in bin/k1520dbg bin/k1520disktool-cli \
                       share/doc/handbuch_k1520dbg.md \
                       share/tools/z80_disasm2.py \
                       share/doc/lizenzen/isocline-LICENSE.txt \
                       share/doc/lizenzen/greaseweazle-COPYING.txt; do
            [ -f "$root/$datei" ] || { echo "FEHLER: $datei fehlt im Paket"; exit 1; }
          done
          # Das Greaseweazle-Rad liegt NEBEN der Payload (wie requirements.lock):
          # der Installer spielt es in die Laufzeitumgebung ein, in der
          # Installation selbst hat es nichts verloren.
          rad=$(ls "$root"/../wheels/greaseweazle-*-py3-none-any.whl 2>/dev/null | head -1)
          [ -n "$rad" ] || { echo "FEHLER: kein plattformunabhaengiges Greaseweazle-Rad"; exit 1; }
          echo "     $(basename "$rad")"
          # Der Kern darf von Greaseweazle NICHTS wissen (Entwurf §14: kein USB,
          # kein Import, kein Rueckruf) — sonst waere ein anderer Adapter eine
          # Kernaenderung.
          if grep -qa greaseweazle "$root/bin/libk1520core.so"; then
            echo "FEHLER: der Kern nennt greaseweazle"; exit 1
          fi

      - name: Paket als Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: k1520emu-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.sha256
          retention-days: 30

      - name: An das Release hängen (nur bei Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          # Beide Jobs laufen GLEICHZEITIG und wollen dasselbe Release anlegen.
          # Ein blosses `view || create` ist deshalb ein Wettlauf: finden beide
          # nichts, legen beide an, und der zweite scheitert mit „already
          # exists".  Also anlegen DUERFEN beide, scheitern darf keiner — und
          # danach wird gewartet, bis es wirklich da ist.
          # Der Beschreibungstext kommt aus packaging/release_notes.md.in — sonst
          # steht am Release nur „Full Changelog", und ein Anwender sieht drei
          # Dateien ohne einen Hinweis, welche er braucht.  Die Vorlage liegt im
          # Repository und wird mit dem Code gepflegt.
          TAG_OHNE_V="${TAG#v}"
          sed -e "s/@TAG@/$TAG/g" -e "s/@VERSION@/$TAG_OHNE_V/g" \
              packaging/release_notes.md.in > "$RUNNER_TEMP/notes.md"
          grep -q '@' "$RUNNER_TEMP/notes.md" \
            && { echo "unersetzte Platzhalter in den Release-Notizen:" >&2;
                 grep -n '@[A-Z]' "$RUNNER_TEMP/notes.md" >&2; exit 1; } || true
          gh release create "$TAG" --draft --title "K1520emu $TAG" \
              --notes-file "$RUNNER_TEMP/notes.md" 2>/dev/null || true
          for versuch in 1 2 3 4 5; do
              if gh release view "$TAG" >/dev/null 2>&1; then break; fi
              echo "warte auf das Release (Versuch $versuch)…"; sleep 3
          done
          gh release view "$TAG" >/dev/null 2>&1 \
            || { echo "Release $TAG existiert nicht und liess sich nicht anlegen" >&2; exit 1; }
          gh release upload "$TAG" dist/*.tar.gz dist/*.sha256 --clobber
          echo "Linux-Paket liegt am Release **$TAG** (Entwurf)." >> "$GITHUB_STEP_SUMMARY"

  windows:
    name: Windows x64 — Paket
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: MSVC-Umgebung (vcvars64) übernehmen
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * `
                  -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
                  -property installationPath
          if (-not $vs) { throw "Keine Visual-Studio-Installation mit C++-Werkzeugen gefunden" }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $wanted = @('PATH','INCLUDE','LIB','LIBPATH','VSINSTALLDIR','VCINSTALLDIR',
                      'VCToolsInstallDir','WindowsSdkDir','WindowsSDKVersion','UCRTVersion')
          cmd /c "`"$vcvars`" >nul 2>&1 && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              if ($wanted -contains $matches[1]) { "$($matches[1])=$($matches[2])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8 }
            }
          }

      # `choco install` endet mit Code 0, auch wenn es nichts installiert hat
      # (Serverstörung → „installed 0/0 packages").  Deshalb wird nachgesehen.
      - name: Ninja und Inno Setup bereitstellen
        shell: pwsh
        run: |
          function Beschaffen($werkzeug, $pfad) {
            if (Get-Command $werkzeug -ErrorAction SilentlyContinue) { return $true }
            if ($pfad -and (Test-Path -LiteralPath $pfad)) {
              Add-Content -Path $env:GITHUB_PATH -Value $pfad
              $env:Path = "$pfad;$env:Path"
              if (Get-Command $werkzeug -ErrorAction SilentlyContinue) { return $true }
            }
            choco install $werkzeug -y --no-progress | Out-Host
            $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + $env:Path
            if ($pfad) { Add-Content -Path $env:GITHUB_PATH -Value $pfad; $env:Path = "$pfad;$env:Path" }
            return [bool] (Get-Command $werkzeug -ErrorAction SilentlyContinue)
          }
          if (-not (Beschaffen 'ninja' $null)) { throw 'ninja liess sich nicht beschaffen' }
          if (-not (Beschaffen 'iscc' "${env:ProgramFiles(x86)}\Inno Setup 6")) {
            throw 'Inno Setup liess sich nicht beschaffen — ohne iscc gibt es kein Setup'
          }

      - name: Paket schnüren
        # Dasselbe Skript wie unter Linux.  Es setzt für Windows selbst, was für
        # ein VERTEILBARES Paket nicht verhandelbar ist: -DK1520_FORMATS_DEFAULT=
        # und -DK1520_MSVC_STATIC_CRT=ON (ohne die statische CRT startet der
        # Emulator auf einem frischen Windows nicht — der per-user-Installer
        # kann kein VC-Redist nachinstallieren, §5.1).
        shell: bash
        env:
          DISKS: ${{ inputs.disks || 'default' }}
        run: packaging/build_payload.sh --disks "$DISKS" --setup

      # Dieselben drei Fragen wie im Linux-Rauchtest, nur mit Windows-Antworten.
      # Ein Paket, dessen DLL nichts exportiert, dessen Pfade nicht auflösen oder
      # das noch am VC-Redist hängt, darf kein Release-Asset werden.
      - name: Rauchtest — DLL lädt, Pfade lösen auf, keine fremde Laufzeit
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'probe'
          New-Item -ItemType Directory -Force -Path $probe | Out-Null
          Expand-Archive -Path (Get-ChildItem dist\*.zip | Select-Object -First 1).FullName `
                         -DestinationPath $probe -Force
          $root = (Get-ChildItem -Directory $probe | Select-Object -First 1).FullName + '\payload'

          Write-Host '── Pfadauflösung im Installationslayout ──'
          $env:K1520_HOME = $root
          $pfade = & python "$root\app\main.py" --paths
          $pfade | ForEach-Object { Write-Host $_ }
          # Erst zu EINER Zeichenkette fügen.  `-match`/`-notmatch` auf einem
          # ARRAY liefern die passenden bzw. die NICHT passenden Elemente zurück,
          # und ein nicht-leeres Array ist in `if()` wahr — `$pfade -notmatch …`
          # schlug damit zu, sobald irgendeine der acht Zeilen nicht passte, also
          # immer.  Die Ausgabe war die ganze Zeit richtig.
          $text = $pfade -join "`n"
          if ($text -notmatch '(?m)^Layout:\s*Installation') { throw 'Payload wird nicht als Installation erkannt' }
          if ($text -match 'NICHT GEFUNDEN') { throw 'ein Pfad löst nicht auf' }
          Remove-Item Env:\K1520_HOME

          Write-Host '── C-ABI ──'
          # Bewusst ein Zeilen-Array statt eines Here-Strings: dessen Abschluss
          # `"@` muss in PowerShell in Spalte 0 stehen und zerlegt damit den
          # YAML-Block, in dem er steht.
          $abi = Join-Path $env:RUNNER_TEMP 'abi.py'
          Set-Content -LiteralPath $abi -Encoding UTF8 -Value @(
            'import ctypes, sys',
            'lib = ctypes.CDLL(sys.argv[1])',
            'lib.k1520_version.restype = ctypes.c_char_p',
            "print('k1520_version:', lib.k1520_version().decode())")
          & python $abi "$root\bin\k1520core.dll"
          if ($LASTEXITCODE -ne 0) { throw 'k1520core.dll ist nicht ladbar' }

          Write-Host '── keine fremde C-Laufzeit ──'
          $abh = (& dumpbin /dependents "$root\bin\k1520core.dll") |
                 Select-String '^\s{4}\S+\.dll' | ForEach-Object { $_.Line.Trim() }
          $abh | ForEach-Object { Write-Host "     $_" }
          if ($abh -match 'msvcp\d+\.dll|vcruntime\d+\.dll|ucrtbase\.dll|api-ms-win-crt-') {
            throw 'die DLL braucht das VC-Redist — /MT hat nicht gegriffen (§5.1)'
          }

          Write-Host '── ZIP-Struktur (Trennzeichen, Verzeichnisse) ──'
          # Die ZIP-Spezifikation verlangt SCHRAEGSTRICHE.  Der Explorer
          # verzeiht Backslashes, `unzip` und Pythons zipfile nicht — und dieses
          # Artefakt haengt an einem oeffentlichen Release.  Der Waechter stand
          # zuerst nur in windows-ci.yml und lief beim Release deshalb NIE mit.
          $zipdatei = (Get-ChildItem dist\*.zip | Select-Object -First 1).FullName
          $z = [System.IO.Compression.ZipFile]::OpenRead($zipdatei)
          try {
            $namen = $z.Entries | ForEach-Object { $_.FullName }
          } finally { $z.Dispose() }
          $schlecht = $namen | Where-Object { $_ -like '*\*' }
          if ($schlecht) { throw "ZIP mit Backslash-Trennzeichen: $($schlecht[0])" }
          if (-not ($namen | Where-Object { $_ -like '*/payload/bin/*' })) {
            throw 'ZIP hat keine payload/bin-Eintraege — Struktur kaputt?'
          }
          Write-Host "     $($namen.Count) Eintraege, alle mit Schraegstrich"

          Write-Host '── kein Pfad des Baurechners in der Bibliothek ──'
          # Der Debugger steht mit auf der Liste: er linkt den Kern STATISCH und
          # erbt K1520_FORMATS_DEFAULT ueber k1520_floppy2.
          foreach ($datei in @("$root\bin\k1520core.dll", "$root\bin\k1520dbg.exe")) {
            $bytes = [System.IO.File]::ReadAllBytes($datei)
            $text  = [System.Text.Encoding]::ASCII.GetString($bytes)
            if ($text.Contains("$env:GITHUB_WORKSPACE\data\formats.yaml".Replace('\','/'))) {
              throw "einkompilierter Pfad des Baurechners in $datei"
            }
          }

          Write-Host '── der Debugger startet und antwortet ──'
          # Kein Schalter zum Abfragen: k1520dbg oeffnet immer eine Sitzung.
          # Geprueft wird deshalb die Sitzung — aufmachen, `q`, sauber beenden.
          $ausgabe = 'q' | & "$root\bin\k1520dbg.exe" 2>&1
          if ($LASTEXITCODE -ne 0) { $ausgabe | Write-Host; throw 'k1520dbg.exe startet nicht' }
          $ausgabe | Select-Object -First 3 | ForEach-Object { Write-Host "     $_" }
          # Und einmal mit eingelegter Diskette.
          $disk = Get-ChildItem "$root\share\disks\*.gz" -ErrorAction SilentlyContinue |
                  Select-Object -First 1
          if ($disk) {
            $hfe = Join-Path $env:RUNNER_TEMP 'probe.hfe'
            $ein = [System.IO.File]::OpenRead($disk.FullName)
            $aus = [System.IO.File]::Create($hfe)
            $gz  = New-Object System.IO.Compression.GZipStream($ein, [System.IO.Compression.CompressionMode]::Decompress)
            $gz.CopyTo($aus); $gz.Dispose(); $aus.Dispose(); $ein.Dispose()
            'q' | & "$root\bin\k1520dbg.exe" $hfe | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'k1520dbg.exe beendet sich nicht auf q' }
            Write-Host '     Sitzung an einer Diskette: laeuft und endet auf q'
          }

          Write-Host '── Werkzeuge, Handbuecher und Lizenzen liegen bei ──'
          foreach ($datei in @('bin\k1520dbg.exe', 'bin\k1520disktool-cli.exe',
                               'share\doc\handbuch_k1520dbg.md',
                               'share\tools\z80_disasm2.py',
                               'share\doc\lizenzen\isocline-LICENSE.txt',
                               'share\doc\lizenzen\greaseweazle-COPYING.txt')) {
            if (-not (Test-Path -LiteralPath "$root\$datei")) { throw "$datei fehlt im Paket" }
          }
          $rad = Get-ChildItem "$root\..\wheels\greaseweazle-*-py3-none-any.whl" `
                 -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $rad) { throw 'kein plattformunabhaengiges Greaseweazle-Rad im Paket' }
          Write-Host "     $($rad.Name)"

      - name: Paket als Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: k1520emu-windows-x64
          path: |
            dist/*.zip
            dist/*setup.exe
            dist/*.sha256
          retention-days: 30

      - name: An das Release hängen (nur bei Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          # Siehe Linux-Job: beide laufen gleichzeitig, anlegen darf jeder,
          # scheitern keiner.
          # Der Beschreibungstext kommt aus packaging/release_notes.md.in — sonst
          # steht am Release nur „Full Changelog", und ein Anwender sieht drei
          # Dateien ohne einen Hinweis, welche er braucht.  Die Vorlage liegt im
          # Repository und wird mit dem Code gepflegt.
          TAG_OHNE_V="${TAG#v}"
          sed -e "s/@TAG@/$TAG/g" -e "s/@VERSION@/$TAG_OHNE_V/g" \
              packaging/release_notes.md.in > "$RUNNER_TEMP/notes.md"
          grep -q '@' "$RUNNER_TEMP/notes.md" \
            && { echo "unersetzte Platzhalter in den Release-Notizen:" >&2;
                 grep -n '@[A-Z]' "$RUNNER_TEMP/notes.md" >&2; exit 1; } || true
          gh release create "$TAG" --draft --title "K1520emu $TAG" \
              --notes-file "$RUNNER_TEMP/notes.md" 2>/dev/null || true
          for versuch in 1 2 3 4 5; do
              if gh release view "$TAG" >/dev/null 2>&1; then break; fi
              echo "warte auf das Release (Versuch $versuch)…"; sleep 3
          done
          gh release view "$TAG" >/dev/null 2>&1 \
            || { echo "Release $TAG existiert nicht und liess sich nicht anlegen" >&2; exit 1; }
          # NUR das Setup.  Das .zip enthaelt seit 2026-08-14 kein
          # Installationsskript mehr — unter Windows installiert der Assistent
          # selbst (packaging/k1520emu.iss).  Ein Anwender koennte mit dem
          # Archiv also nichts anfangen; es bleibt Artefakt dieses Laufs, damit
          # der Rauchtest oben hineinsehen kann.
          gh release upload "$TAG" dist/*setup.exe dist/*setup.exe.sha256 --clobber
          echo "Windows-Setup liegt am Release **$TAG** (Entwurf)." >> "$GITHUB_STEP_SUMMARY"
