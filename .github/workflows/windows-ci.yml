# ─────────────────────────────────────────────────────────────────────────────
# Windows — Bauen und Regression (MSVC)
# ─────────────────────────────────────────────────────────────────────────────
#
# Die Gegenprobe zu ci.yml auf der anderen Plattform: DERSELBE Aufruf
# (`tools/dev.sh test`), nur mit MSVC statt GCC.  Löste die frühere
# „Windows-Sonde" ab, die nur die Kernbibliothek baute — seit die Export-Makros
# (core/api/k1520_export.h) und der MSVC-Zweig im CMakeLists da sind, ist die
# ganze Regression erreichbar.
#
# Drei Windows-Eigenheiten, die dieser Workflow abräumt:
#
#  1. MSVC lebt nicht im PATH.  `vcvars64.bat` setzt PATH/INCLUDE/LIB — aber nur
#     für die eine Shell, die es aufruft.  Der erste Schritt findet es über
#     `vswhere` und reicht genau die relevanten Variablen über $GITHUB_ENV an
#     alle FOLGENDEN Schritte weiter.
#  2. Generator = Ninja.  Der Vorgabe-Generator „Visual Studio 17 2022" ist
#     mehrkonfigurativ und legt alles nach build/Release/ — dann stimmt kein
#     eingespielter Pfad mehr.  `tools/dev.sh` erzwingt unter MSYS deshalb Ninja.
#  3. Die Python-Ebene erwartet das venv unter venv/Scripts/ (nicht venv/bin/);
#     tests/python/CMakeLists.txt kennt beide Orte.
#
# Anstoßen:  gh workflow run windows-ci.yml --ref <branch>
#            Actions → „Windows — Bauen und Regression" → Run workflow

name: Windows — Bauen und Regression

on:
  workflow_dispatch:
    inputs:
      testebene:
        description: 'Was laufen soll'
        type: choice
        default: 'test'
        options:
          - test          # volle Regression (ohne die langsamen Format-Label)
          - build         # nur bauen
          - test-level unit
          - test-python

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msvc:
    name: Windows x64 — MSVC
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # ── 1. MSVC-Umgebung in alle folgenden Schritte übernehmen ──────────────
      # Bewusst nur die Variablen, die der Übersetzer braucht: ein vollständiger
      # `set`-Abzug nach $GITHUB_ENV schriebe auch die GITHUB_*-Variablen zurück
      # und stolperte über mehrzeilige Werte.
      - name: MSVC-Umgebung (vcvars64) übernehmen
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * `
                  -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
                  -property installationPath
          if (-not $vs) { throw "Keine Visual-Studio-Installation mit C++-Werkzeugen gefunden" }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          Write-Host "vcvars: $vcvars"
          $wanted = @('PATH','INCLUDE','LIB','LIBPATH','VSINSTALLDIR','VCINSTALLDIR',
                      'VCToolsInstallDir','WindowsSdkDir','WindowsSDKVersion','UCRTVersion')
          cmd /c "`"$vcvars`" >nul 2>&1 && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              $name = $matches[1]; $value = $matches[2]
              if ($wanted -contains $name) { "$name=$value" | Out-File $env:GITHUB_ENV -Append -Encoding utf8 }
            }
          }

      - name: Ninja und sccache bereitstellen
        shell: pwsh
        run: |
          foreach ($werkzeug in 'ninja','sccache') {
            if (Get-Command $werkzeug -ErrorAction SilentlyContinue) {
              Write-Host "$werkzeug vorhanden: $((Get-Command $werkzeug).Source)"
            } else {
              choco install $werkzeug -y --no-progress
            }
          }

      - name: Werkzeuge zeigen
        shell: bash
        run: |
          cl 2>&1 | head -2 || true
          cmake --version | head -1
          ninja --version
          sccache --version
          bash --version | head -1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Python-Testebene vorbereiten
        # tests/python/CMakeLists.txt nimmt <repo>/venv/Scripts/python.exe und
        # registriert die Ebene nur, wenn pytest+PySide6+PyYAML dort liegen.
        shell: bash
        run: |
          python -m venv venv
          venv/Scripts/python.exe -m pip install --upgrade pip
          venv/Scripts/python.exe -m pip install -r requirements-dev.txt

      # GoogleTest wird beim ersten Konfigurieren geladen (FetchContent) — den
      # entpackten Baum aufheben, das spart je Lauf einen Download.
      - name: GoogleTest-Zwischenstand
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: gtest-windows-v1.14.0
          restore-keys: gtest-windows-

      # ── Übersetzer-Zwischenspeicher (das Gegenstück zu ccache in ci.yml) ─────
      # Der MSVC-Bau war mit Abstand der teuerste Schritt.  Gemessen 2026-08-12,
      # derselbe Stand zweimal gefahren:
      #
      #     kalt   Bau+Tests 202 s,  Lauf gesamt 260 s,  Trefferquote   0 %
      #     warm   Bau+Tests  48 s,  Lauf gesamt 100 s,  Trefferquote 100 %
      #
      # (davon 16 s Tests, der Rest Bau und Binden).  Das ist keine Kostenfrage,
      # solange das Repository öffentlich ist — dann sind die Minuten frei —, wohl
      # aber eine, sobald es privat wird: Windows-Minuten zählen DOPPELT gegen das
      # Kontingent (§2.4).
      - name: sccache-Zwischenstand
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\.sccache
          key: sccache-windows-${{ github.sha }}
          restore-keys: sccache-windows-

      # `|| 'test'` ist kein Zierrat: wer den Workflow über die API anstößt, ohne
      # eine Eingabe mitzugeben, bekäme sonst `tools/dev.sh` ohne Kommando — und
      # das druckt die Hilfe und meldet Erfolg, ohne etwas geprüft zu haben.
      - name: Bauen und Regression (tools/dev.sh ${{ inputs.testebene || 'test' }})
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          # CMake liest CMAKE_<LANG>_COMPILER_LAUNCHER beim Konfigurieren aus der
          # UMGEBUNG — deshalb braucht tools/dev.sh dafür keine Zeile.  Wichtig:
          # das wirkt nur, weil dev.sh hier frisch konfiguriert (build/ ist im
          # Lauf noch nicht vorhanden).
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
          CMAKE_C_COMPILER_LAUNCHER: sccache
          SCCACHE_DIR: ${{ github.workspace }}\.sccache
          # Der Vorgabewert (10 GB) sprengte den 10-GB-Rahmen eines Actions-
          # Zwischenspeichers; 2 GB reichen für diesen Baum mit Reserve.
          SCCACHE_CACHE_SIZE: 2G
        run: |
          sccache --zero-stats >/dev/null 2>&1 || true
          tools/dev.sh ${{ inputs.testebene || 'test' }}

      # Zeigt, ob der Zwischenspeicher wirklich greift.  Ohne diese Zeile merkt
      # niemand, wenn sccache jede Datei durchreicht („non-cacheable") — der Bau
      # wäre dann nur unverändert langsam, nicht kaputt.
      - name: sccache-Ausbeute
        if: always()
        shell: bash
        run: sccache --show-stats || true

      # ── Die Kernprüfung der Portierung: exportiert die DLL überhaupt etwas? ──
      # Ohne K1520_API exportiert eine MSVC-DLL GAR NICHTS, und ctypes findet
      # keine einzige Funktion (doc/design/13_distribution.md §6.1).  Der Test
      # py_c_api prüft dasselbe von der Python-Seite; diese Stufe sagt es
      # deutlicher, wenn es schiefgeht.
      - name: Exportierte Symbole prüfen
        if: always()
        shell: pwsh
        run: |
          # dumpbin liegt dank vcvars (erster Schritt) im PATH.
          foreach ($name in 'k1520core.dll','k1520disk.dll') {
            $dll = Get-ChildItem -Recurse -Filter $name build -ErrorAction SilentlyContinue |
                   Select-Object -First 1
            if (-not $dll) { throw "$name wurde nicht gebaut" }
            $exports = & dumpbin /exports $dll.FullName
            $anzahl = ($exports | Select-String 'k1520d?_[a-z0-9_]+').Count
            Write-Host "$name : $anzahl exportierte k1520-Funktionen"
            if ($anzahl -lt 30) {
              throw "$name exportiert nur $anzahl Funktionen — Export-Makros fehlen (§6.1)"
            }
          }

      - name: DLLs als Artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k1520-windows-x64
          path: |
            build/k1520core.dll
            build/k1520disk.dll
          if-no-files-found: ignore
          retention-days: 7

      - name: Protokolle bei Fehlschlag sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ci-logs
          path: |
            build/Testing/Temporary/LastTest.log
            logs/
          if-no-files-found: ignore
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────────
  # Auslieferungsbau: statische CRT
  # ───────────────────────────────────────────────────────────────────────────
  #
  # Der Bau, den das Windows-Paket später braucht — und der bis hierher NIE
  # gelaufen ist.  Auf ihm steht die Prämisse des ganzen Installers:
  #
  #   Der Installer läuft per-user OHNE Administratorrechte (Anforderung A4) und
  #   kann deshalb KEIN „Visual C++ Redistributable" nachinstallieren.  Die
  #   ausgelieferte DLL muss ihre C-Laufzeit also selbst mitbringen (/MT).  Tut
  #   sie das nicht, startet der Emulator auf einem frischen Windows gar nicht —
  #   mit der Meldung „VCRUNTIME140.dll fehlt", die der Anwender nicht beheben
  #   kann.  Genau das fällt sonst erst beim ersten echten Anwender auf.
  #
  # Warum das nicht im Job oben mitläuft: GoogleTest erzwingt die DYNAMISCHE CRT
  # (gtest_force_shared_crt), und /MT neben /MD gibt beim Linken „mismatch
  # detected for RuntimeLibrary".  Der Auslieferungsbau braucht deshalb
  # zwingend -DBUILD_K1520_TESTS=OFF — also einen eigenen Job.
  auslieferung:
    name: Windows x64 — Auslieferungsbau (statische CRT)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: MSVC-Umgebung (vcvars64) übernehmen
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * `
                  -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
                  -property installationPath
          if (-not $vs) { throw "Keine Visual-Studio-Installation mit C++-Werkzeugen gefunden" }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $wanted = @('PATH','INCLUDE','LIB','LIBPATH','VSINSTALLDIR','VCINSTALLDIR',
                      'VCToolsInstallDir','WindowsSdkDir','WindowsSDKVersion','UCRTVersion')
          cmd /c "`"$vcvars`" >nul 2>&1 && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              if ($wanted -contains $matches[1]) { "$($matches[1])=$($matches[2])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8 }
            }
          }

      - name: Ninja bereitstellen
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # -DK1520_FORMATS_DEFAULT= ist NICHT verhandelbar: sonst trägt jede
      # ausgelieferte Bibliothek den absoluten Pfad des Baurechners als
      # Suchkandidaten für formats.yaml (dieselbe Regel wie in release.yml).
      - name: Bauen (/MT, ohne Tests)
        shell: bash
        run: |
          cmake -B build_dist -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DLOG_LEVEL=3 \
                -DK1520_MSVC_STATIC_CRT=ON \
                -DBUILD_K1520_TESTS=OFF \
                -DK1520_FORMATS_DEFAULT=
          cmake --build build_dist -j --target k1520core k1520disk

      # Der eigentliche Beweis.  Ein erfolgreicher Bau sagt NICHTS darüber, ob
      # die CRT wirklich drin steckt — das steht nur in der Importtabelle.
      - name: Hängt die DLL noch an einer fremden Laufzeit?
        shell: pwsh
        run: |
          $verboten = 'msvcp\d+\.dll|vcruntime\d+\.dll|ucrtbase\.dll|api-ms-win-crt-'
          foreach ($name in 'k1520core.dll','k1520disk.dll') {
            $dll = Get-ChildItem -Recurse -Filter $name build_dist | Select-Object -First 1
            if (-not $dll) { throw "$name wurde nicht gebaut" }
            $abh = (& dumpbin /dependents $dll.FullName) |
                   Select-String '^\s{4}\S+\.dll' | ForEach-Object { $_.Line.Trim() }
            Write-Host "── $name ($([math]::Round($dll.Length/1KB)) KB) hängt an:"
            $abh | ForEach-Object { Write-Host "     $_" }
            $treffer = $abh | Where-Object { $_ -match $verboten }
            if ($treffer) {
              throw "$name braucht das VC-Redist: $($treffer -join ', ') — /MT hat nicht gegriffen (§5.1)"
            }
          }

      # Und laufen muss sie auch.  Eine DLL ohne Abhängigkeiten, die beim Laden
      # abstürzt, wäre die teuerste Art, den Test zu bestehen.  Geladen wird per
      # ctypes — genau so, wie die GUI es später tut.
      - name: Lädt sie und antwortet sie?
        shell: bash
        run: |
          cat > ladetest.py <<'PY'
          import ctypes, sys
          lib = ctypes.CDLL(sys.argv[1])
          lib.k1520_version.restype = ctypes.c_char_p
          fassung = lib.k1520_version().decode()
          print("k1520_version() =", fassung)
          assert fassung.count(".") == 2, f"keine Versionsnummer: {fassung!r}"
          PY
          sed -i 's/^          //' ladetest.py
          python ladetest.py "$(find build_dist -name k1520core.dll | head -1)"

      - name: DLLs als Artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k1520-windows-x64-statische-crt
          path: build_dist/*.dll
          if-no-files-found: ignore
          retention-days: 7
