# ─────────────────────────────────────────────────────────────────────────────
# Bauen und Regression — dieselbe Runde, die der pre-push-Hook lokal fährt
# ─────────────────────────────────────────────────────────────────────────────
#
# WIRD NUR VON HAND ANGESTOSSEN (workflow_dispatch).  Kein Auslöser bei Push
# oder Pull Request: die Regression läuft lokal ohnehin vor jedem Push
# (.githooks/pre-push), der Lauf hier ist die Gegenprobe auf einem sauberen
# System — und wann die nötig ist, entscheidet der Mensch.
#
# Anstoßen (Einzelheiten und GitHub-Einstellungen: doc/ci_pipeline.md):
#     Actions → „Bauen und Regression" → Run workflow
#     gh workflow run ci.yml --ref main
#
# Bewusst über `tools/dev.sh`, nicht über rohe cmake/ctest-Aufrufe: das Script
# ist die Stelle, an der Build-Typ, LOG_LEVEL und die ausgeschlossenen Label
# (format_integration/format_matrix) definiert sind.  Läuft die CI daran vorbei,
# testet sie etwas anderes als der Entwickler.
#
# Die langsamen Formatläufe stehen in slow-tests.yml.

name: Bauen und Regression

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux — Bauen und Regression
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Systempakete
        run: |
          sudo apt-get update
          # libreadline-dev: k1520dbg bekommt Zeileneditor + Vervollständigung
          #   (optional — ohne baut es auch, dann fällt ein Codepfad aus dem Test).
          # libegl1/libgl1/libxkbcommon0/libdbus-1-3: PySide6 braucht diese
          #   Systembibliotheken auch für QT_QPA_PLATFORM=offscreen.
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ccache libreadline-dev \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Python-Testebene vorbereiten
        # tests/python/CMakeLists.txt bevorzugt <repo>/venv/bin/python3 und
        # registriert die Ebene nur, wenn pytest+PySide6+PyYAML dort liegen.
        run: |
          python3 -m venv venv
          venv/bin/python3 -m pip install --upgrade pip
          venv/bin/python3 -m pip install -r requirements-dev.txt

      - name: ccache-Zwischenstand
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-

      - name: Bauen und Regression (tools/dev.sh test)
        env:
          CC: ccache gcc
          CXX: ccache g++
          CCACHE_MAXSIZE: 500M
        run: tools/dev.sh test

      - name: ccache-Ausbeute
        if: always()
        run: ccache -s

      - name: Protokolle bei Fehlschlag sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            build/Testing/Temporary/LastTest.log
            logs/
          if-no-files-found: ignore
          retention-days: 7
