# ─────────────────────────────────────────────────────────────────────────────
# Windows-Sonde — VORBEREITUNG, noch kein Release-Job
# ─────────────────────────────────────────────────────────────────────────────
#
# Der Kern ist noch nicht MSVC-fähig (doc/design/13_distribution.md §6.1):
#
#   * core/api/k1520_api.h trägt nur `extern "C"`, keine Export-Makros — eine
#     MSVC-DLL exportiert damit GAR NICHTS und ctypes findet keine Funktion.
#     Übergangsweise setzt dieser Job WINDOWS_EXPORT_ALL_SYMBOLS.
#   * CMakeLists.txt ist auf GCC zugeschnitten; für MSVC braucht es /utf-8
#     (die Quellen enthalten deutsche Umlaute) und die statische CRT.
#
# Dieser Job baut deshalb NUR die Kernbibliothek, läuft NUR auf Zuruf
# (workflow_dispatch) und blockiert nichts.  Er ist die Messlatte für die
# Portierung: sobald er grün ist und die DLL ihre Symbole exportiert, wird
# daraus ein zweiter Job in release.yml (Paket + Inno-Setup, §5.1).

name: Windows-Sonde (experimentell)

on:
  workflow_dispatch:

jobs:
  msvc:
    name: Windows x64 — Kernbibliothek (MSVC)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Konfigurieren
        run: >
          cmake -S . -B build_win
          -DCMAKE_BUILD_TYPE=Release
          -DLOG_LEVEL=3
          -DK1520_FORMATS_DEFAULT=
          -DBUILD_K1520_TESTS=OFF
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          -DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON
          -DCMAKE_CXX_FLAGS="/utf-8"

      - name: Bauen
        run: cmake --build build_win --config Release --target k1520core

      - name: Exportierte Symbole prüfen
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse -Filter k1520core.dll build_win | Select-Object -First 1
          if (-not $dll) { throw "k1520core.dll nicht gebaut" }
          $dumpbin = (Get-ChildItem -Recurse -Filter dumpbin.exe `
                      "${env:ProgramFiles}\Microsoft Visual Studio" | Select-Object -First 1).FullName
          $exports = & $dumpbin /exports $dll.FullName
          $exports | Select-String 'k1520_version' `
            | ForEach-Object { $_.Line } `
            | Tee-Object -Variable treffer
          if (-not $treffer) { throw "DLL exportiert k1520_version nicht (§6.1: Export-Makros fehlen)" }

      - name: DLL als Artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k1520core-windows-x64
          path: build_win/**/k1520core.dll
          if-no-files-found: ignore
