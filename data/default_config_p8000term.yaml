# P8000 Terminal — AUSLIEFERUNGSKONFIGURATION
# ===========================================
#
# Der Zustand, in dem das Programm `p8000term` (Arbeitsplatz-Terminal des P8000: Originalterminal
# Typ 2 + Flachtastatur K7673.09, ohne Rechner) nach der Erstinstallation aufgeht.  Gelesen wird sie
# an zwei Stellen (`app/config_io.py`, `standard_konfiguration()`): beim ERSTEN Start, solange es
# noch keine `p8000term.yaml` des Anwenders gibt, und bei *Ansicht ▸ Standard zurücksetzen*.
#
# Gleicher Aufbau wie die gespeicherte `p8000term.yaml`.  Bewusst NICHT hinein gehören `disks:`,
# `platte:` (die Terminaleinheit hat keine) und `window.geometry` (Bildschirmposition des
# Baurechners).  Die Verbindung zum Rechner (Adresse, Port) steht unter `schnittstellen:` und wird
# vom Programm geschrieben, sobald sie eingestellt ist.
#
# Mehrere Arbeitsplätze nebeneinander: `p8000term --instance platz2` legt eine eigene
# Konfiguration `p8000term-platz2.yaml` an.
version: 1

crt:
  phosphor_on: '#78D41D'
  phosphor_off: '#050F05'
  brightness: 2.5
  contrast: 1.1

# Das Terminal ist Echtzeitgerät: Tempo 1,0 (Z8-Takt 3,6864 MHz).
general:
  speed: 1.0
  # Modell: p8000-term (nur das Terminal) vorn; die Rechner-Modelle des p8000emu sind wählbar.
  model: p8000-term

terminal:
  # ganzzahlig (scharfe Pixel) | glatt (füllt das Fenster)
  skalierung: glatt

window:
  width: 1100
  height: 760
  maximized: false
  toolbar:
  - konfig_laden
  - konfig_speichern
  - ''
  - power
  - reset
  - verbindung
  - ''
  - dock_settings
  - dock_keyboard
  - ''
  - hilfe
  toolbar_style: 3
