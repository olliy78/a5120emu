# K8915 Emulator — AUSLIEFERUNGSKONFIGURATION
# ============================================
#
# Das ist der Zustand, in dem der K8915 Emulator nach der Erstinstallation aufgeht
# (der A5120 Emulator hat seine eigene: default_config_a5120.yaml):
# Bildröhre, Tempo, Laufwerksbestückung, Fenstergröße, Kastenaufteilung und
# Symbolleiste.  Gelesen wird sie an genau zwei Stellen (`app/config_io.py`,
# `standard_konfiguration()`):
#
#   * beim ERSTEN Start, solange es noch keine `k8915emu.yaml` des Anwenders gibt
#     (`MainWindow._load_or_create_default_config`), und
#   * bei *Ansicht ▸ Standard zurücksetzen* — dort überschreibt sie die
#     Konfiguration des Anwenders.
#
# Der Aufbau ist derselbe wie in der gespeicherten `k8915emu.yaml`
# (`app/config_io.py`), eine gesicherte Konfiguration lässt sich also
# unverändert hierher kopieren.  ZWEI Abschnitte gehören aber bewusst NICHT
# hinein:
#
#   * `disks:` — Diskettenabbilder stehen mit absolutem Pfad darin, und der
#     Pfad des Baurechners ist auf keinem anderen Rechner gültig.  Ohne den
#     Abschnitt lässt das Zurücksetzen die eingelegten Disketten in Ruhe (siehe
#     `MainWindow._apply_config`) — das Zurücksetzen der ANSICHT soll die
#     Maschine nicht leerräumen.
#   * `window.geometry` — darin steckt die Bildschirmposition des Fensters.
#     `width`/`height` reichen; wo das Fenster aufgeht, entscheidet der
#     Fensterverwalter.
version: 1

# Bildröhre — der Standardlook (siehe app/ui/screen_widget.py::CRTParams).
crt:
  phosphor_on: '#78D41D'
  phosphor_off: '#050F05'
  brightness: 2.47
  contrast: 2.0
  contrast_small_factor: 0.7
  scanline_strength: 1.4
  scanline_count: 288.0
  scanline_min_height: 768.0
  glow_strength: 1.0
  glow_radius: 2.5
  mask_strength: 0.0
  mask_pitch: 1.0
  curvature:
  - 0.1
  - 0.1
  corner_radius: 0.0
  vignette_strength: 0.35
  flicker_strength: 0.0
  scale_x: 0.98
  scale_y: 0.98
  offset_x: 0.0
  offset_y: 0.0

# Tempo als Vielfaches des Nenntakts (app/takt.py: 1,0 = 2,4576 MHz, 0,0 = unbegrenzt).
# Zehnfach: der Selbsttest des Boot-ROMs dauert sonst ≈ 12 s.
general:
  speed: 10.0
  # Lochstreifen (ADA K6022, SIF1000) gesteckt? doc/design/23_lochstreifen.md §7.
  ptape: false

# RAM-Floppy RAF auf E/A 88H/89H (app/raf.py, doc/design/22_raf512.md §7):
# raf = none | raf128 | raf512 | raf2m; raf_standby = Inhalt beim Beenden behalten.
# Ab Werk keine Karte und kein Stand-by.
machine:
  raf: none
  raf_standby: false

# Laufwerksschacht wie am Gerät: zwei K5601, Steckplatz 2/3 leer.
drive_types:
- K5601
- K5601
- none
- none

window:
  width: 1262
  height: 768
  maximized: false
  # QMainWindow.saveState(), base64.  Die Tastatur ist AUS (am K8915 tippt man
  # meist auf der PC-Tastatur), Einstellungen und Laufwerke rechts.  Aufgenommen
  # offscreen mit einem K8915-Fenster in 1262×768 (neu aufzunehmen wie beim A5120:
  # Fenster einrichten, den `window`-Abschnitt der eigenen k8915emu.yaml kopieren).
  dock_state: 
  # Inhalt der Symbolleiste: Aktionsnamen aus app/ui/actions.py, '' = Trennstrich.
  # `nmi` ist der NMI-Taster der Frontplatte — neben Reset, wie am Gerät.
  toolbar:
  - konfig_laden
  - konfig_speichern
  - ''
  - power
  - reset
  - nmi
  - ''
  - dock_settings
  - dock_drives
  - dock_keyboard
  - ''
  - hilfe
  # Qt.ToolButtonStyle: 3 = Symbol mit Text darunter.
  toolbar_style: 3
