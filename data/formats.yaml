# ═════════════════════════════════════════════════════════════════════════════
#  DATEISYSTEME (k1520DiskTool)
#
#  Der Emulator liest diese Sektion NICHT — sie beschreibt die logische Ebene:
#  welches Dateisystem auf einer Geometrie liegt und wo es beginnt.  Geladen von
#  FsCatalog (core/filesystem/fs_catalog.cpp).  Vollstaendiges Schema:
#  doc/design/13_k1520disktool.md §6.3
#
#  Gemeinsame Felder
#    name         (Pflicht)  eindeutiger Name — CLI, GUI, C-API
#    description  (optional) Klartext fuer die Oberflaeche
#    format       (Pflicht)  Name eines Eintrags aus `formats:` (die Geometrie)
#    type         (Pflicht)  cpm | udos | udos1715
#    data_start   (optional) erste Spur des Dateisystems (Vorgabe cyl 0 / head 0)
#    containers   (optional) img | hfe | dmk (Vorgabe: alle; udos nie img — udos1715 schon)
#    detect_rank  (optional) Reihenfolge bei mehrdeutiger Erkennung (kleiner = frueher)
#
#  Nur type: cpm      block_size, dir_entries, skew, os
#  Nur type: udos/    sides_separate, boot_track, directory_track, bitmap_track,
#           udos1715  usable_tracks   (udos1715 zusaetzlich: system_track0;
#                     sides_separate ist dort immer false — die Spur ist der Zylinder)
#
#  ┌─────────────────────────────────────────────────────────────────────────┐
#  │ Der Beginn des Dateisystems ist eine SPUR, kein Byte-Offset.            │
#  │ Bei gemischter Geometrie (cpa780: drei 128-B-Seiten, dann 1024 B) ist   │
#  │ er als Spurzahl gar nicht ausdrueckbar — cpmtools traegt deshalb        │
#  │ `offset 15104` ein.  Aus data_start rechnet der SectorSpace denselben   │
#  │ Wert aus, und er bleibt bei jeder Geometrie richtig.                    │
#  └─────────────────────────────────────────────────────────────────────────┘
# ═════════════════════════════════════════════════════════════════════════════

filesystems:

  # ══ CP/A ═══════════════════════════════════════════════════════════════════

  - name:        cpa780
    description: "CP/A 780K Bootdiskette — Dateisystem ab Zylinder 2"
    format:      cpa780
    type:        cpm
    # NACHGEMESSEN an tests/fixtures/disks/cpa_cpa780_k5601_clock.img: das Verzeichnis
    # steht bei Byte 15104 = Anfang c2h0; die erste Datei belegt ab Block 2, also sind
    # zwei 2048-B-Bloecke Verzeichnis = 128 Eintraege.  Blockzeiger sind 16 Bit
    # (390 Bloecke > 255) — das ergibt sich aus der Groesse und steht nicht im Profil.
    data_start:  { cyl: 2, head: 0 }
    block_size:  2048
    dir_entries: 128

  - name:        cpa800
    description: "CP/A 800K Datendiskette — Dateisystem ab Zylinder 0"
    format:      cpa800
    type:        cpm
    # 192, nicht 128: FORMAT.COM nennt den Menuepunkt selbst „5×1024, Sp. 0-159;
    # 192 Dir.-Eintraege" (doc/format.md §3.1, Wahl 0), und das BIOS rechnet dasselbe
    # aus — `dtrsl3` Zeile 80DS traegt dsldir=191, und die Kuerzung auf 128 greift nur
    # bei Disketten MIT Systemspuren (`selddr`).  Mit 128 blieben die Plaetze 128…191
    # einer echten 800K-Diskette unsichtbar.  Siehe core/filesystem/cpm/cpa_dpb.cpp.
    block_size:  2048
    dir_entries: 192

  # ENTFERNT 2026-08-11: `cpa640` (dieselbe 16×256-Geometrie, Dateisystem ab
  # Zylinder 0).  Der Eintrag war geraten — CP/A kann so eine Diskette gar nicht
  # erzeugen: fuer 256-B-Sektoren traegt `dtrsl1` ein FESTES Offset von 4 logischen
  # Spuren, das Verzeichnis liegt dort IMMER auf c2h0 (Profil `scpx640` unten).
  # Er sorgte nur dafuer, dass jede 16×256-Diskette „nicht eindeutig" gemeldet wurde.

  # ══ SCPX ═══════════════════════════════════════════════════════════════════

  - name:        scpx640
    description: "SCPX 640K (16×256) — Systemzylinder 0-1, Dateisystem ab Zylinder 2"
    format:      cpa640
    type:        cpm
    # NACHGEMESSEN an tests/fixtures/disks/scpx17_cpa780_k5601.hfe (Verzeichnis bei
    # c2h0 = Byte 16384) und deckungsgleich mit dem, was die CP/A-Regel ausrechnet
    # (core/filesystem/cpm/cpa_dpb.cpp).  Der Eintrag bleibt, weil `create --fs`
    # einen Namen braucht — erkannt wuerde die Diskette auch ohne ihn.
    data_start:  { cyl: 2, head: 0 }
    block_size:  2048
    dir_entries: 128

  - name:        scpx798
    description: "SCPX 798K — Systemzylinder 0 in 16×256, Dateisystem ab Zylinder 2"
    format:      scpx798
    type:        cpm
    # NACHGEMESSEN an tests/fixtures/disks/scpx17_5x1024_k5601_hardy.hfe.
    data_start:  { cyl: 2, head: 0 }
    block_size:  2048
    dir_entries: 128

  # ══ UDOS 1526 / 4.x (ZDOS) ═════════════════════════════════════════════════
  # Feste Spurlage aus UDOS_/PC1715/FORMATPC.MAC (BOOTSSPUR 15H, DIRECTORYSPUR 16H,
  # BITMAPSPUR 17H), belegt am Referenzdatentraeger — doc/udos_diskettenformat.md §3.
  # Beide Seiten sind getrennte Dateisysteme (§2) und erscheinen im Werkzeug als
  # Side0/ und Side1/ EINES Datentraegers.

  - name:        udos_ds77
    description: "UDOS 4.x doppelseitig — 77 Spuren 26×128, je Seite ein Dateisystem"
    format:      udos_ds77
    type:        udos

  - name:        udos_ss77
    description: "UDOS 4.x einseitig — 77 Spuren 26×128"
    format:      udos_ss77
    type:        udos

  - name:        udos_ss40
    description: "UDOS 4.x einseitig — 40 Spuren 26×128 (K5600.10)"
    format:      k5601_ss40_26x128
    type:        udos
    usable_tracks: 40

  # ══ UDOS1715 / NDOS (PC 1715) ══════════════════════════════════════════════
  # Dieselbe Betriebssystemfamilie, ANDERES Dateisystem: der uPD765 des PC 1715
  # erreicht die Bytes hinter der Daten-CRC nicht, deshalb steht die Verkettung in
  # eigenen ZEIGERSEKTOREN statt im Gap.  Folgen (doc/udos1715_diskettenformat.md):
  #   * 256-B-Sektoren, reines Standard-IBM  ->  .img ist moeglich und richtig
  #   * eine "Spur" umfasst BEIDE Seiten eines Zylinders (32 Sektoren)  ->  eine
  #     Diskette ist EIN Datentraeger, kein Side0/Side1
  #   * feste Lage: Verzeichnis Spur 16H, Belegungsplan Spur 17H Sektor 0/1
  # Die drei zugelassenen Formate stehen woertlich im Handbuch §1.2.

  - name:        udos1715
    description: "UDOS1715/NDOS — 80 Spuren doppelseitig, 16×256 (640K, Standard)"
    format:      k5601_16x256
    type:        udos1715
    detect_rank: -10

  - name:        udos1715_ss80
    description: "UDOS1715/NDOS — 80 Spuren einseitig, 16×256 (320K)"
    format:      k5601_ss80_16x256
    type:        udos1715
    detect_rank: -10

  - name:        udos1715_ss40
    description: "UDOS1715/NDOS — 40 Spuren einseitig, 16×256 (160K)"
    format:      k5601_ss40_16x256
    type:        udos1715
    usable_tracks: 40
    detect_rank: -10
