# ─────────────────────────────────────────────────────────────────────────────
#  Diskettenformat-Katalog des K1520-Kerns
#
#  Vollständige Schema-Beschreibung: doc/K1520_architecture.md §8.6
#  Geladen von FormatCatalog (core/peripherals/floppy_drive/format_catalog.cpp).
#
#  Format-Ebene
#    name         (Pflicht)  eindeutiger Katalogname — C-API, GUI, Tools
#    description  (optional) Klartext für die GUI
#    drives       (Pflicht)  kompatible Laufwerksprofile; NUR diese bieten das Format an
#                            gültig: K5601, K5600.10, K5600.20, MF3200, MF6400
#    default_for  (optional) Profile, für die dies das Standardformat beim Anlegen ist
#    encoding     (optional) fm | mfm — Vorgabe für Spuren ohne eigenes encoding
#    containers   (optional) img | hfe — darstellbare Dateitypen (Default: beide)
#    tracks       (Pflicht)  Liste disjunkter Spurbereiche
#
#  Spurbereich
#    cyls / heads   Bereich, INKLUSIVE ("0", "2-79", "0-1")
#    sectors        Sektoren je Spur
#    size           Bytes/Sektor (128 | 256 | 512 | 1024)
#    encoding       (optional) fm | mfm — überschreibt die Format-Vorgabe (Mischdichte)
#    first_sector   (optional) erste Sektor-ID (Default 1)
#
#  ┌───────────────────────────────────────────────────────────────────────────┐
#  │ ACHTUNG — Verfahren nicht „aufhübschen".                                  │
#  │ Die A5120-Bootdisketten sind reines Standard-IBM-MFM: der Boot-ROM        │
#  │ startet in FM, findet keine Adressmarke und schaltet per MK auf MFM um    │
#  │ (doc/K1520_architecture.md §14.5).  Würde man die 128-B-Systemspuren von  │
#  │ cpa780/scpx780 als `encoding: fm` deklarieren — was intuitiv plausibel    │
#  │ wirkt —, bräche der verifizierte Bootpfad.  Alle 5,25″-Formate sind       │
#  │ deshalb durchgängig MFM; FM benutzt nur das echte 8″-SD-Format mf3200.    │
#  └───────────────────────────────────────────────────────────────────────────┘
# ─────────────────────────────────────────────────────────────────────────────
version: 1

formats:

  # ══ CP/A-Standardformate (5,25″, K5601) ════════════════════════════════════

  - name:        cpa780
    description: "CP/A 780K Bootdiskette — 128B-Systembereich, 1024B-Daten"
    drives:      [K5601]
    encoding:    mfm
    tracks:
      # Der Systembereich sind DREI physische 128-B-Seiten (Zyl 0 beidseitig +
      # Zyl 1 Kopf 0); der 1024-B-Datenbereich beginnt asymmetrisch bei Zyl 1
      # Kopf 1, damit das Verzeichnis exakt auf die Zyl-2-Grenze fällt.
      - { cyls: 0,    heads: 0-1, sectors: 26, size: 128  }
      - { cyls: 1,    heads: 0,   sectors: 26, size: 128  }
      - { cyls: 1,    heads: 1,   sectors: 5,  size: 1024 }
      - { cyls: 2-79, heads: 0-1, sectors: 5,  size: 1024 }

  - name:        cpa800
    description: "CP/A 800K — 80 Spuren doppelseitig, durchgängig 5×1024"
    drives:      [K5601]
    default_for: [K5601]
    encoding:    mfm
    tracks:
      - { cyls: 0-79, heads: 0-1, sectors: 5, size: 1024 }

  # 640K bzw. 624K passen nur DOPPELSEITIG: 80 × 2 × 16 × 256 B = 640 KB.
  # (Einseitig wären es 320 KB — so stand es bis 2026-08-03 fälschlich im Katalog
  # und davor in den einkompilierten builtinFormats().)  Damit sind beide Formate
  # ausschließlich am zweiköpfigen K5601 fahrbar.
  - name:        cpa640
    description: "CP/A 640K — 80 Spuren doppelseitig, 16×256"
    drives:      [K5601]
    encoding:    mfm
    tracks:
      - { cyls: 0-79, heads: 0-1, sectors: 16, size: 256 }

  - name:        cpa624
    description: "CP/A 624K — 78 Spuren doppelseitig, 16×256 (reduzierte Kapazität)"
    drives:      [K5601]
    encoding:    mfm
    tracks:
      - { cyls: 0-77, heads: 0-1, sectors: 16, size: 256 }

  - name:        cpa200
    description: "CP/A 400K — 80 Spuren einseitig, 5×1024 (K5600.20)"
    drives:      [K5601, K5600.20]
    default_for: [K5600.20]
    encoding:    mfm
    tracks:
      - { cyls: 0-79, heads: 0, sectors: 5, size: 1024 }

  - name:        cpa200_boot
    description: "CP/A 400K bootfähig — 128B-Systemspuren 0-2, danach 5×1024"
    drives:      [K5601, K5600.20]
    encoding:    mfm
    tracks:
      - { cyls: 0-2,  heads: 0, sectors: 26, size: 128  }
      - { cyls: 3-79, heads: 0, sectors: 5,  size: 1024 }

  # ══ SCPX-Varianten (5,25″, doppelseitig) ═══════════════════════════════════

  - name:        scpx780
    description: "SCPX 780K — Systemspuren 0-2 mit 26×128, Daten 5×1024"
    drives:      [K5601]
    encoding:    mfm
    tracks:
      - { cyls: 0-2,  heads: 0-1, sectors: 26, size: 128  }
      - { cyls: 3-79, heads: 0-1, sectors: 5,  size: 1024 }

  - name:        scpx780_b
    description: "SCPX 780K Variante B — Geometrie wie scpx780"
    drives:      [K5601]
    encoding:    mfm
    tracks:
      - { cyls: 0-2,  heads: 0-1, sectors: 26, size: 128  }
      - { cyls: 3-79, heads: 0-1, sectors: 5,  size: 1024 }

  - name:        scpx798
    description: "SCPX 798K — Systemzylinder 0 in 16×256, Daten 5×1024"
    drives:      [K5601]
    encoding:    mfm
    # GEMESSEN an tests/fixtures/disks/scpx17_5x1024_k5601_hardy.hfe (GeometryProbe):
    # nur Zylinder 0 ist beidseitig 16×256, ab Zylinder 1 durchgängig 5×1024.  Ohne
    # diesen Eintrag passte die Diskette zu keinem Format des Katalogs.
    tracks:
      - { cyls: 0,    heads: 0-1, sectors: 16, size: 256  }
      - { cyls: 1-79, heads: 0-1, sectors: 5,  size: 1024 }

  # ══ UDOS 1526 / 4.x (ZDOS) ═════════════════════════════════════════════════
  # UDOS formatiert 77 Spuren zu 26×128 MFM.  Beide Seiten tragen je ein eigenes,
  # vollständiges Dateisystem (doc/udos_diskettenformat.md §2) — physisch ist das
  # trotzdem EIN Format.  Beide Einträge sind an den Referenzdisketten gemessen
  # (`disks/udos_boot_*.hfe`, GeometryProbe).

  - name:        udos_ds77
    description: "UDOS 4.x — 77 Spuren doppelseitig, 26×128 (je Seite ein Dateisystem)"
    drives:      [K5601]
    encoding:    mfm
    tracks:
      - { cyls: 0-76, heads: 0-1, sectors: 26, size: 128 }

  - name:        udos_ss77
    description: "UDOS 4.x — 77 Spuren einseitig, 26×128"
    drives:      [K5601, K5600.20, MF6400]
    encoding:    mfm
    tracks:
      - { cyls: 0-76, heads: 0, sectors: 26, size: 128 }

  # ══ 8″-Laufwerke ═══════════════════════════════════════════════════════════

  # Beide 8″-Laufwerke sind einseitig mit 77 Spuren.  Das MF3200 beherrscht NUR FM
  # (~300K), das MF6400 zusätzlich MFM (~600K) — deshalb ist das FM-Format auf beiden
  # fahrbar, das MFM-Format nur auf dem MF6400.  Das K5602 ist zum MF3200 voll
  # kompatibel und hat kein eigenes Profil.

  - name:        mf3200
    description: "8″ 308K — 77 Spuren einseitig, 4×1024 FM (Einfachdichte)"
    drives:      [MF3200, MF6400]
    default_for: [MF3200]
    encoding:    fm
    tracks:
      - { cyls: 0-76, heads: 0, sectors: 4, size: 1024 }

  - name:        mf6400
    description: "8″ 616K — 77 Spuren einseitig, 8×1024 MFM (Doppeldichte)"
    drives:      [MF6400]
    default_for: [MF6400]
    encoding:    mfm
    tracks:
      - { cyls: 0-76, heads: 0, sectors: 8, size: 1024 }

  # ══ K5601 §3 — 80 Spuren doppelseitig ══════════════════════════════════════
  # Viele §3-Formate teilen dieselbe ROHgeometrie; Systemspuren, Verzeichnis-
  # einträge und Sektor-Interleave ändern das Offset-Layout der .img nicht.

  - name:        k5601_16x256
    description: "K5601 §3 Formate 4/5 — 80 Spuren doppelseitig, 16×256"
    drives:      [K5601]
    encoding:    mfm
    tracks:
      - { cyls: 0-79, heads: 0-1, sectors: 16, size: 256 }

  - name:        k5601_16x256_77
    description: "K5601 §3 Format 7 (ZIK-NK) — 77 Spuren doppelseitig, 16×256"
    drives:      [K5601]
    encoding:    mfm
    tracks:
      - { cyls: 0-76, heads: 0-1, sectors: 16, size: 256 }

  - name:        k5601_26x128
    description: "K5601 §3 Format 6 — 80 Spuren doppelseitig, 26×128"
    drives:      [K5601]
    encoding:    mfm
    tracks:
      - { cyls: 0-79, heads: 0-1, sectors: 26, size: 128 }

  - name:        k5601_9x512
    description: "K5601 §3 Formate E/F — 80 Spuren doppelseitig, 9×512"
    drives:      [K5601]
    encoding:    mfm
    tracks:
      - { cyls: 0-79, heads: 0-1, sectors: 9, size: 512 }

  - name:        k5601_10x512
    description: "K5601 §3 Formate G/J — 80 Spuren doppelseitig, 10×512"
    drives:      [K5601]
    encoding:    mfm
    tracks:
      - { cyls: 0-79, heads: 0-1, sectors: 10, size: 512 }

  # ══ K5601 §3.4 — einseitig (S) ═════════════════════════════════════════════

  - name:        k5601_ss80_26x128
    description: "K5601 §3.4 Format S — 80 Spuren einseitig, 26×128"
    drives:      [K5601, K5600.20]
    encoding:    mfm
    tracks:
      - { cyls: 0-79, heads: 0, sectors: 26, size: 128 }

  - name:        k5601_ss80_9x512
    description: "K5601 §3.4 Format S — 80 Spuren einseitig, 9×512"
    drives:      [K5601, K5600.20]
    encoding:    mfm
    tracks:
      - { cyls: 0-79, heads: 0, sectors: 9, size: 512 }

  # ══ K5601 §3.4 — 40 Spuren Einzelschritt, einseitig (W) ════════════════════

  - name:        k5601_ss40_5x1024
    description: "K5601 §3.4 Format W — 40 Spuren einseitig, 5×1024 (K5600.10, 200K)"
    drives:      [K5600.10, K5600.20, K5601]
    default_for: [K5600.10]
    encoding:    mfm
    tracks:
      - { cyls: 0-39, heads: 0, sectors: 5, size: 1024 }

  - name:        k5601_ss40_26x128
    description: "K5601 §3.4 Format W — 40 Spuren einseitig, 26×128"
    drives:      [K5600.10, K5600.20, K5601]
    encoding:    mfm
    tracks:
      - { cyls: 0-39, heads: 0, sectors: 26, size: 128 }

  - name:        k5601_ss40_16x256
    description: "K5601 §3.4 Format W — 40 Spuren einseitig, 16×256"
    drives:      [K5600.10, K5600.20, K5601]
    encoding:    mfm
    tracks:
      - { cyls: 0-39, heads: 0, sectors: 16, size: 256 }

  - name:        k5601_ss40_15x256
    description: "K5601 §3.4 Format W — 40 Spuren einseitig, 15×256"
    drives:      [K5600.10, K5600.20, K5601]
    encoding:    mfm
    tracks:
      - { cyls: 0-39, heads: 0, sectors: 15, size: 256 }

  # ══ K5601 §3.4 — 40 Spuren Einzelschritt, doppelseitig (V) ═════════════════

  - name:        k5601_ds40_5x1024
    description: "K5601 §3.4 Format V — 40 Spuren doppelseitig, 5×1024"
    drives:      [K5601]
    encoding:    mfm
    tracks:
      - { cyls: 0-39, heads: 0-1, sectors: 5, size: 1024 }

  - name:        k5601_ds40_26x128
    description: "K5601 §3.4 Format V — 40 Spuren doppelseitig, 26×128"
    drives:      [K5601]
    encoding:    mfm
    tracks:
      - { cyls: 0-39, heads: 0-1, sectors: 26, size: 128 }

  - name:        k5601_ds40_16x256
    description: "K5601 §3.4 Format V — 40 Spuren doppelseitig, 16×256"
    drives:      [K5601]
    encoding:    mfm
    tracks:
      - { cyls: 0-39, heads: 0-1, sectors: 16, size: 256 }

  - name:        k5601_ds40_17x256
    description: "K5601 §3.4 Format V — 40 Spuren doppelseitig, 17×256"
    drives:      [K5601]
    encoding:    mfm
    tracks:
      - { cyls: 0-39, heads: 0-1, sectors: 17, size: 256 }

# ═════════════════════════════════════════════════════════════════════════════
#  DATEISYSTEME (k1520DiskTool)
#
#  Der Emulator liest diese Sektion NICHT — sie beschreibt die logische Ebene:
#  welches Dateisystem auf einer Geometrie liegt und wo es beginnt.  Geladen von
#  FsCatalog (core/filesystem/fs_catalog.cpp).  Vollstaendiges Schema:
#  doc/design/13_k1520disktool.md §6.3
#
#  Gemeinsame Felder
#    name         (Pflicht)  eindeutiger Name — CLI, GUI, C-API
#    description  (optional) Klartext fuer die Oberflaeche
#    format       (Pflicht)  Name eines Eintrags aus `formats:` (die Geometrie)
#    type         (Pflicht)  cpm | udos
#    data_start   (optional) erste Spur des Dateisystems (Vorgabe cyl 0 / head 0)
#    containers   (optional) img | hfe | dmk (Vorgabe: alle; udos nie img)
#    detect_rank  (optional) Reihenfolge bei mehrdeutiger Erkennung (kleiner = frueher)
#
#  Nur type: cpm      block_size, dir_entries, skew, os
#  Nur type: udos     sides_separate, boot_track, directory_track, bitmap_track,
#                     usable_tracks
#
#  ┌─────────────────────────────────────────────────────────────────────────┐
#  │ Der Beginn des Dateisystems ist eine SPUR, kein Byte-Offset.            │
#  │ Bei gemischter Geometrie (cpa780: drei 128-B-Seiten, dann 1024 B) ist   │
#  │ er als Spurzahl gar nicht ausdrueckbar — cpmtools traegt deshalb        │
#  │ `offset 15104` ein.  Aus data_start rechnet der SectorSpace denselben   │
#  │ Wert aus, und er bleibt bei jeder Geometrie richtig.                    │
#  └─────────────────────────────────────────────────────────────────────────┘
# ═════════════════════════════════════════════════════════════════════════════

filesystems:

  # ══ CP/A ═══════════════════════════════════════════════════════════════════

  - name:        cpa780
    description: "CP/A 780K Bootdiskette — Dateisystem ab Zylinder 2"
    format:      cpa780
    type:        cpm
    # NACHGEMESSEN an tests/fixtures/disks/cpa_cpa780_k5601_clock.img: das Verzeichnis
    # steht bei Byte 15104 = Anfang c2h0; die erste Datei belegt ab Block 2, also sind
    # zwei 2048-B-Bloecke Verzeichnis = 128 Eintraege.  Blockzeiger sind 16 Bit
    # (390 Bloecke > 255) — das ergibt sich aus der Groesse und steht nicht im Profil.
    data_start:  { cyl: 2, head: 0 }
    block_size:  2048
    dir_entries: 128

  - name:        cpa800
    description: "CP/A 800K Datendiskette — Dateisystem ab Zylinder 0"
    format:      cpa800
    type:        cpm
    block_size:  2048
    dir_entries: 128

  - name:        cpa640
    description: "CP/A 640K (16×256) — Dateisystem ab Zylinder 0"
    format:      cpa640
    type:        cpm
    block_size:  2048
    dir_entries: 128

  # ══ SCPX ═══════════════════════════════════════════════════════════════════

  - name:        scpx640
    description: "SCPX 640K (16×256) — Systemzylinder 0-1, Dateisystem ab Zylinder 2"
    format:      cpa640
    type:        cpm
    # NACHGEMESSEN an tests/fixtures/disks/scpx17_cpa780_k5601.hfe (Verzeichnis bei
    # c2h0 = Byte 16384).  Dieselbe Geometrie wie cpa640, anderes data_start — genau
    # der Fall, fuer den `filesystems:` eine eigene Sektion ist.
    data_start:  { cyl: 2, head: 0 }
    block_size:  2048
    dir_entries: 128

  - name:        scpx798
    description: "SCPX 798K — Systemzylinder 0 in 16×256, Dateisystem ab Zylinder 2"
    format:      scpx798
    type:        cpm
    # NACHGEMESSEN an tests/fixtures/disks/scpx17_5x1024_k5601_hardy.hfe.
    data_start:  { cyl: 2, head: 0 }
    block_size:  2048
    dir_entries: 128

  # ══ UDOS 1526 / 4.x (ZDOS) ═════════════════════════════════════════════════
  # Feste Spurlage aus UDOS_/PC1715/FORMATPC.MAC (BOOTSSPUR 15H, DIRECTORYSPUR 16H,
  # BITMAPSPUR 17H), belegt am Referenzdatentraeger — doc/udos_diskettenformat.md §3.
  # Beide Seiten sind getrennte Dateisysteme (§2) und erscheinen im Werkzeug als
  # Side0/ und Side1/ EINES Datentraegers.

  - name:        udos_ds77
    description: "UDOS 4.x doppelseitig — 77 Spuren 26×128, je Seite ein Dateisystem"
    format:      udos_ds77
    type:        udos

  - name:        udos_ss77
    description: "UDOS 4.x einseitig — 77 Spuren 26×128"
    format:      udos_ss77
    type:        udos

  - name:        udos_ss40
    description: "UDOS 4.x einseitig — 40 Spuren 26×128 (K5600.10)"
    format:      k5601_ss40_26x128
    type:        udos
    usable_tracks: 40
